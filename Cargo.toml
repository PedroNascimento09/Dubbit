[workspace]
members = ["core", "apps/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Pedro Nascimento"]
repository = "https://github.com/PedroNascimento09/Dubbit"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
ureq = { version = "2.10.1", default-features = false, features = ["tls", "native-certs", "json"] }
csv = "1.3.1"
tempfile = "3.13.0"
clap = { version = "4.5.20", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
