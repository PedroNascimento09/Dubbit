[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "glib-macros pulls it on Linux at build time; Tauri has no newer GTK binding and no runtime code is affected" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
