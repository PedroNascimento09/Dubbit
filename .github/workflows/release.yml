name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Helper programs
        run: python scripts/bundle-tools.py windows-x64
      - name: Installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles nsis
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage-cli dist/stage-portable
          cp target/release/bundle/nsis/*-setup.exe dist/
          cp target/release/dubbit.exe LICENSE NOTICE README.md dist/stage-cli/
          cp target/release/dubbit-desktop.exe target/release/WebView2Loader.dll dist/stage-portable/
          cp -r apps/desktop/src-tauri/resources/bin dist/stage-portable/
          cp -r apps/desktop/src-tauri/resources/licenses dist/stage-portable/
          cp LICENSE NOTICE README.md THIRD_PARTY_NOTICES.md dist/stage-portable/
          (cd dist/stage-cli && 7z a ../dubbit-windows-x86_64.zip .)
          (cd dist/stage-portable && 7z a ../dubbit-windows-x86_64-portable.zip .)
          rm -rf dist/stage-cli dist/stage-portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Window and packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2
      - name: Test
        run: cargo test --workspace
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Helper programs
        run: python3 scripts/bundle-tools.py linux-x64
      - name: Installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles deb,appimage
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/
          tar -czf dist/dubbit-linux-x86_64.tar.gz -C target/release dubbit -C "$PWD" LICENSE NOTICE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Bill of materials
        run: python3 scripts/sbom.py dist/dubbit-sbom.cdx.json
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
