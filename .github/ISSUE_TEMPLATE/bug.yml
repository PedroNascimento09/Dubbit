name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues first.
        Never attach private media. Review the diagnostic report before sharing it.
  - type: input
    id: version
    attributes:
      label: Dubbit version
      description: The output of `dubbit --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Processor, memory and graphics adapter.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error code and the full message.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Run `dubbit doctor --report report.json`, read it, remove personal paths, then paste or attach it.
      render: json
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I reviewed the diagnostic report and removed personal information.
          required: true
        - label: This report does not contain private media or credentials.
          required: true
