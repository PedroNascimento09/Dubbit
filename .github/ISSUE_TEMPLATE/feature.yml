name: Feature request
description: Propose a capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Check the roadmap first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Dubbit makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen, from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds or designs you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Subtitles
        - Transcription
        - Translation
        - Dubbing
        - Models
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
